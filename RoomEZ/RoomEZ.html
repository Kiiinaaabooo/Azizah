<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roomez | Temukan Kamar Mahasiswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

  <!-- Navbar -->
  <header class="bg-white shadow-sm fixed w-full z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-md flex items-center justify-center text-white font-bold">R</div>
        <div>
          <h1 class="text-lg font-semibold">roomez</h1>
          <p class="text-xs text-gray-500">find your next student room</p>
        </div>
      </div>
      <nav class="hidden md:flex gap-4 items-center text-sm text-gray-600">
        <a href="#" class="hover:text-indigo-600">Discover</a>
        <a href="#" class="hover:text-indigo-600">Bookings</a>
        <a href="#" class="hover:text-indigo-600">Host</a>
        <button class="ml-3 px-3 py-1 rounded-md border border-indigo-600 text-indigo-600 text-sm">Masuk</button>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-28 pb-16">

    <!-- Search Bar -->
    <section class="bg-gradient-to-r from-indigo-50 to-white p-6 rounded-lg shadow-sm">
      <div class="flex flex-col md:flex-row gap-4 items-center">
        <input id="searchInput" type="text" placeholder="Cari lokasi atau tipe kamar..." class="flex-1 px-4 py-3 rounded-md border border-gray-200 focus:outline-none">
        <select id="guestFilter" class="px-3 py-2 rounded-md border border-gray-200 bg-white">
          <option value="0">Semua tamu</option>
          <option value="1">1 tamu</option>
          <option value="2">2 tamu</option>
          <option value="3">3+ tamu</option>
        </select>
        <button id="resetBtn" class="px-4 py-2 rounded-md border border-gray-200 text-sm">Reset</button>
      </div>
    </section>

    <!-- Room Cards -->
    <section class="mt-10">
      <h2 class="text-xl font-semibold mb-4">Hasil Pencarian</h2>
      <div id="roomContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <p id="noResult" class="text-center text-gray-500 hidden mt-10">Tidak ada kamar yang cocok dengan pencarian Anda.</p>
    </section>
  </main>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg max-w-lg w-full p-6 relative">
      <button id="closeModal" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700">✕</button>
      <img id="modalImage" src="" alt="Room" class="w-full h-56 object-cover rounded-md mb-4">
      <h3 id="modalTitle" class="text-2xl font-semibold"></h3>
      <p id="modalLocation" class="text-gray-500 mb-3"></p>
      <p id="modalDesc" class="text-gray-700 mb-4">Informasi lengkap kamar, fasilitas, peraturan, dan metode pembayaran dapat ditambahkan di sini.</p>
      <p id="modalPrice" class="font-semibold mb-4"></p>
      <button class="bg-indigo-600 text-white px-5 py-2 rounded-md">Booking Sekarang</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center text-sm text-gray-500 py-10 border-t mt-10">
    © <span id="year"></span> roomez · Dibuat dengan ❤️ untuk mahasiswa
  </footer>

  <script>
    const rooms = [
      {
        id: 1,
        name: "Kamar Single Minimalis",
        location: "Gubeng, Surabaya",
        price: 120000,
        guests: 1,
        image: "images/room1.jpg"
      },
      {
        id: 2,
        name: "Kamar Double Nyaman",
        location: "Kampus ITS",
        price: 200000,
        guests: 2,
        image: "images/room2.jpg"
      },
      {
        id: 3,
        name: "Studio Modern",
        location: "Dukuh Pakis",
        price: 250000,
        guests: 2,
        image: "images/room3.jpg"
      },
      {
        id: 4,
        name: "Kost Premium",
        location: "Kebraon",
        price: 150000,
        guests: 1,
        image: "images/room4.jpg"
      }
    ];

    const roomContainer = document.getElementById('roomContainer');
    const searchInput = document.getElementById('searchInput');
    const guestFilter = document.getElementById('guestFilter');
    const resetBtn = document.getElementById('resetBtn');
    const noResult = document.getElementById('noResult');
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const modalTitle = document.getElementById('modalTitle');
    const modalLocation = document.getElementById('modalLocation');
    const modalPrice = document.getElementById('modalPrice');
    const closeModal = document.getElementById('closeModal');
    const year = document.getElementById('year');

    function formatIDR(num) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
    }

    function renderRooms() {
      const query = searchInput.value.toLowerCase();
      const guestCount = Number(guestFilter.value);

      const filtered = rooms.filter(r => {
        const matchesQuery = r.name.toLowerCase().includes(query) || r.location.toLowerCase().includes(query);
        const matchesGuest = guestCount === 0 || r.guests >= guestCount;
        return matchesQuery && matchesGuest;
      });

      roomContainer.innerHTML = '';
      if (filtered.length === 0) {
        noResult.classList.remove('hidden');
      } else {
        noResult.classList.add('hidden');
        filtered.forEach(room => {
          const card = document.createElement('div');
          card.className = 'bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-lg transition-shadow';
          card.innerHTML = `
            <img src=\"${room.image}\" alt=\"${room.name}\" class=\"w-full h-44 object-cover\">
            <div class=\"p-4\">
              <div class=\"flex justify-between items-start mb-2\">
                <div>
                  <h3 class=\"font-semibold\">${room.name}</h3>
                  <p class=\"text-sm text-gray-500\">${room.location}</p>
                </div>
                <div class=\"text-right text-sm\">
                  <p class=\"text-gray-500\">per malam</p>
                  <p class=\"font-semibold\">${formatIDR(room.price)}</p>
                </div>
              </div>
              <p class=\"text-xs text-gray-600 mb-3\">Tamu: ${room.guests}</p>
              <button class=\"w-full py-2 rounded-md bg-indigo-600 text-white\" onclick=\"openModal(${room.id})\">Lihat Detail</button>
            </div>`;
          roomContainer.appendChild(card);
        });
      }
    }

    function openModal(id) {
      const room = rooms.find(r => r.id === id);
      modalImage.src = room.image;
      modalTitle.textContent = room.name;
      modalLocation.textContent = room.location;
      modalPrice.textContent = 'Harga: ' + formatIDR(room.price) + ' / malam';
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    closeModal.addEventListener('click', () => modal.classList.add('hidden'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.add('hidden');
    });
    resetBtn.addEventListener('click', () => {
      searchInput.value = '';
      guestFilter.value = '0';
      renderRooms();
    });
    searchInput.addEventListener('input', renderRooms);
    guestFilter.addEventListener('change', renderRooms);

    year.textContent = new Date().getFullYear();
    renderRooms();
  </script>
</body>
</html>
